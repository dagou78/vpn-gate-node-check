name: VPN Gate Node Check

on:
  # ⚠️ GitHub Actions 的高频 schedule 会被合并/丢弃: 实测 cron 写 */30, 实际约 4-8 小时才跑一次。
  #    这是 GitHub 侧的行为, 把间隔写得更小也不会变准; 需要真正的高频请改用 Cloudflare Worker Cron Trigger。
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 检测 Worker: 必须是你自己在 Cloudflare 部署的那个。
          # 共用别人的公共 Worker 会互相拖垮 (教程评论区就有 "Worker 异常 89 / 耗时 0.2s" 的失败案例)。
          CHECK_WORKER: "https://worer.3418013863.workers.dev/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

          # 入口优选 IP: 从 bestcf 地区文件拉候选, 端到端探测通过才写进 hosts.txt
          # (只做 TCP 探测会误判: 实测有 "TCP 25ms 通, 但 TLS 证书不受信" 的假入口)
          EDGE_POOL_BASE: "https://bestcf.pages.dev/tiancheng"
          EDGE_POOL_REGIONS: "kr,jp,sg"
          EDGE_PROBE_TIMEOUT: "8"
          EDGE_PROBE_WORKERS: "8"

          # 生成文件里显示的"固定地址"基址 (别再用模板作者的 jerylihub.github.io)
          PAGES_BASE: "https://dagou78.github.io/vpn-gate-node-check"
          # 实际刷新周期说明 (别再写"每 30 分钟")
          REFRESH_HINT: "GitHub Actions 定时任务, 实际间隔约 4-8 小时, 以生成时间为准"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://jerylihub.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'
